<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Dashboard</h1>
        <p>Selamat datang kembali! Mari lanjutkan perjalanan postur Anda.</p>
    </header>
    
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value" id="workoutCount">0</div>
            <div class="stat-label">Latihan Selesai</div>
        </div>
        <div class="stat-card">
            <div class="stat-value progress-value" id="weeklyProgress">0%</div>
            <div class="stat-label">Progres Minggu Ini</div>
        </div>
    </div>

    <main class="menu-grid">
        <a href="#" class="menu-card">
            <div class="menu-icon stats-icon">📊</div>
            <h2>Body Stats</h2>
            <p>Analisis Postur</p>
        </a>

        <a href="scoliometer.html" class="menu-card">
            <div class="menu-icon ruler-icon">📐</div>
            <h2>Scoliometer</h2>
            <p>Pengukuran ATR</p>
        </a>
    </main>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>

    <a href="programlatihan.html" class="nav-item">
        <i class="fas fa-running"></i>
        <span>Latihan</span>
    </a>

    <a href="ai.html" class="nav-item">
        <i class="fas fa-robot"></i>
        <span>AI</span>
    </a>

    <a href="scoliometer.html" class="nav-item">
        <i class="fas fa-ruler"></i>
        <span>Scoliometer</span>
    </a>

    <a href="settings.html" class="nav-item">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
    </a>
</nav>

<script>
/* ===============================
   🔐 CEK AKSES DASHBOARD
=============================== */
document.addEventListener("DOMContentLoaded", function () {

    const isRegistered = localStorage.getItem("isRegistered");
    const hasMeasured = localStorage.getItem("hasMeasured");

    if (isRegistered !== "true") {
        window.location.href = "index.html";
        return;
    }

    if (hasMeasured !== "true") {
        window.location.href = "bodyscan.html";
        return;
    }

    // ===============================
    // 📊 LOAD DATA PROGRES
    // ===============================
    let workoutCompleted = parseInt(localStorage.getItem("workoutCompleted")) || 0;
    let weeklyCompleted = parseInt(localStorage.getItem("weeklyCompleted")) || 0;
    let weeklyTarget = parseInt(localStorage.getItem("weeklyTarget")) || 5;

    // simpan default kalau belum ada
    localStorage.setItem("weeklyTarget", weeklyTarget);

    // hitung progres %
    let progressPercent = Math.round((weeklyCompleted / weeklyTarget) * 100);
    if (progressPercent > 100) progressPercent = 100;

    // update UI
    document.getElementById("workoutCount").textContent = workoutCompleted;
    document.getElementById("weeklyProgress").textContent = progressPercent + "%";
});
</script>

</body>
</html>
